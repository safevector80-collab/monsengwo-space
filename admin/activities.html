<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion des activités — Espace comité</title>
  <meta name="description" content="Ajouter, modifier ou supprimer les activités de la journée culturelle." />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/v2.css" />
</head>
<body>

  <a href="dashboard.html" class="back-link">← Retour au dashboard</a>

  <header class="site-header">
    <div class="header-inner">
      <p class="eyebrow">Espace comité</p>
      <h1>Gestion des activités</h1>
      <p class="subtitle">Ajoute, modifie ou supprime les activités proposées aux élèves.</p>
    </div>
  </header>

  <main class="dashboard-main">

    <section class="programme-form-section" aria-label="Ajouter ou modifier une activité">
      <h2>Ajouter une activité</h2>
      <p class="section-hint">Visible immédiatement sur la page des élèves une fois enregistrée.</p>

      <form id="activite-form" class="inscription-form" novalidate>

        <input type="hidden" id="act-edit-id" value="" />

        <div class="form-group">
          <label for="act-nom">Nom de l'activité</label>
          <input type="text" id="act-nom" name="nom" required placeholder="Ex : Battle de chant et rap" />
        </div>

        <div class="form-group">
          <label for="act-categorie">Catégorie</label>
          <select id="act-categorie" name="categorie" required>
            <option value="" disabled selected>Choisir une catégorie</option>
            <option value="theatre">Théâtre</option>
            <option value="defile-moderne">Défilé moderne</option>
            <option value="defile-traditionnel">Défilé traditionnel</option>
            <option value="chant-rap">Chant et Rap</option>
            <option value="danse-afro-hiphop">Danse Afro et Hip-Hop</option>
            <option value="sape">La Sape</option>
          </select>
        </div>

        <div class="form-group">
          <label for="act-description">Description</label>
          <textarea id="act-description" name="description" rows="3" placeholder="Courte description de l'activité"></textarea>
        </div>

        <div class="form-group">
          <label for="act-lieu">Lieu</label>
          <input type="text" id="act-lieu" name="lieu" placeholder="Ex : Grande salle" />
        </div>

        <div class="form-group">
          <label for="act-horaire">Horaire</label>
          <input type="text" id="act-horaire" name="horaire" placeholder="Ex : 14h00 – 15h30" />
        </div>

        <div class="form-group">
          <label for="act-capacite">Capacité maximale</label>
          <input type="number" id="act-capacite" name="capacite_max" min="1" required placeholder="Ex : 25" />
        </div>

        <p class="form-info" id="activite-form-info" role="status" hidden></p>

        <div class="programme-form-actions">
          <button type="submit" class="ticket-btn form-submit" id="activite-submit-btn">Ajouter l'activité</button>
          <button type="button" class="cancel-edit-btn" id="act-cancel-edit" hidden>Annuler la modification</button>
        </div>
      </form>
    </section>

    <section class="programme-list-section" aria-label="Gérer les activités existantes">
      <h2>Activités existantes</h2>
      <ul class="programme-manage-list" id="activite-manage-list">
        <!-- Généré par js/admin/activites-admin.js -->
      </ul>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/admin/activites-admin.js"></script>
</body>
</html>
